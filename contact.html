<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book / Inquire | Moorthy Kalai Arangam</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
</head>
<body>

  <header>
    <div class="container nav-bar">
      <div class="logo">MOORTHY <span>KALAI ARANGAM</span></div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="amenities.html">Facilities</a></li>
        <li><a href="contact.html" class="active">Check Availability</a></li>
      </ul>
    </div>
  </header>

  <section class="section container">
    <div class="section-title">
      <h2>Check Date Availability & Booking</h2>
      <p>Submit your event requirements to receive an instant callback or send directly via WhatsApp.</p>
    </div>

    <div class="form-container">
      <form id="bookingForm" onsubmit="sendViaEmail(event)">
        <div class="form-group">
          <label for="custName">Full Name *</label>
          <input type="text" id="custName" required placeholder="e.g. S. Ramanathan">
        </div>

        <div class="form-group">
          <label for="custPhone">Phone Number *</label>
          <input type="tel" id="custPhone" required placeholder="+91 98765 43210">
        </div>

        <div class="form-group">
          <label for="bookingType">Required Facility *</label>
          <select id="bookingType" required>
            <option value="Wedding Hall (Main)">Wedding Hall (Central AC, 1200 Capacity)</option>
            <option value="Mini Hall">Mini Hall</option>
            <option value="Guest Rooms Only">22 Guest Rooms Only</option>
            <option value="All Facilities Combined">Combined (Halls + 22 Rooms)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="eventDate">Event Date *</label>
          <input type="date" id="eventDate" required>
        </div>

        <div class="form-group">
          <label for="eventDetails">Additional Requirements (Cooking/Guest Count)</label>
          <textarea id="eventDetails" rows="4" placeholder="Let us know approximate guest count or specific arrangements..."></textarea>
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Send via Email</button>
          <button type="button" onclick="sendViaWhatsApp()" class="btn btn-whatsapp" style="flex: 1;">Send via WhatsApp</button>
        </div>
      </form>
    </div>
  </section>

  <footer>
    <div class="container footer-bottom">
      &copy; 2026 Moorthy Kalai Arangam, Kumbakonam.
    </div>
  </footer>

  <script>
    // 1. Prefill facility selection from URL parameter (e.g. contact.html?type=mini)
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type');
      const dropdown = document.getElementById('bookingType');

      if (type === 'wedding') dropdown.value = 'Wedding Hall (Main)';
      if (type === 'mini') dropdown.value = 'Mini Hall';
      if (type === 'rooms') dropdown.value = 'Rooms Only';
    });

    // 2. Contact Routing Endpoints
    const HALL_PHONE = "916381752600";         // WhatsApp destination number
    const EMAIL_MANDAPAM = "moorthykalaiarangam@gmail.com";   // Destination for Wedding & Mini Hall
    const EMAIL_ROOMS = "muraliinn@gmail.com";       // Destination for Rooms Only

    // 3. Form Message Compiler
    function compileMessage() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const facility = document.getElementById('bookingType').value;
      const date = document.getElementById('eventDate').value;
      const details = document.getElementById('eventDetails').value.trim() || 'None provided';

      return `New Booking Enquiry - Moorthy Kalai Arangam\n` +
             `------------------------------------\n` +
             `Name: ${name}\n` +
             `Phone: ${phone}\n` +
             `Facility: ${facility}\n` +
             `Event Date: ${date}\n` +
             `Details / Requests: ${details}`;
    }

    // 4. Form Field Validation Helper
    function validateInputs() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const date = document.getElementById('eventDate').value;

      if (!name) {
        alert("Please enter your full name.");
        document.getElementById('custName').focus();
        return false;
      }
      if (!phone) {
        alert("Please enter your phone number.");
        document.getElementById('custPhone').focus();
        return false;
      }
      if (!date) {
        alert("Please select an event date.");
        document.getElementById('eventDate').focus();
        return false;
      }
      return true;
    }

    // 5. Send via WhatsApp
    function sendViaWhatsApp() {
      if (!validateInputs()) return;

      const message = compileMessage();
      const encodedMsg = encodeURIComponent(message);
      const whatsappUrl = `https://wa.me/${HALL_PHONE}?text=${encodedMsg}`;
      
      window.open(whatsappUrl, '_blank');
    }

    // 6. Send via Email (Auto-routes based on chosen service)
    function sendViaEmail(e) {
      e.preventDefault();
      if (!validateInputs()) return;

      const facility = document.getElementById('bookingType').value;
      const targetEmail = (facility === "Guest Rooms Only") ? EMAIL_ROOMS : EMAIL_MANDAPAM;
      
      const subject = encodeURIComponent(`Booking Enquiry [${facility}] - Moorthy Kalai Arangam`);
      const body = encodeURIComponent(compileMessage());
      
      window.location.href = `mailto:${targetEmail}?subject=${subject}&body=${body}`;
    }
  </script>
</body>
</html>
